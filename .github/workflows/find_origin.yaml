name: Find Origin IP via CloudRip File Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone CloudRip & Install Dependencies
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/moscovium-mc/CloudRip.git cloudrip_engine
          cd cloudrip_engine
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "requirements.txt not found in CloudRip repo" >&2
            exit 1
          fi

      - name: Initialize Readable Security Report
        shell: bash
        run: |
          REPORT_FILE="$GITHUB_WORKSPACE/origin_ip_report.txt"
          echo "==========================================================" > "$REPORT_FILE"
          echo "           CLOUD DISCOVERY INFRASTRUCTURE REPORT         " >> "$REPORT_FILE"
          echo "           Generated: $(date -u)" >> "$REPORT_FILE"
          echo "==========================================================" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"

      - name: Loop and Scan Domains From File
        shell: bash
        run: |
          set -e
          REPORT_FILE="$GITHUB_WORKSPACE/origin_ip_report.txt"
          DOMAINS_FILE="$GITHUB_WORKSPACE/domains.txt"
          
          if [ ! -f "$DOMAINS_FILE" ]; then
            echo "domains.txt not found in repository root" >&2
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/cloudrip_engine"

          while IFS= read -r line || [ -n "$line" ]; do
            # Handle section headers (comments starting with #)
            if [[ "$line" =~ ^# ]]; then
              echo "" >> "$REPORT_FILE"
              echo "=========================================================" >> "$REPORT_FILE"
              echo "$line" >> "$REPORT_FILE"
              echo "=========================================================" >> "$REPORT_FILE"
              echo "" >> "$REPORT_FILE"
              echo "Processing section: $line"
              continue
            fi

            # Skip empty lines
            [[ -z "$line" ]] && continue

            domain=$(echo "$line" | sed -e 's|^[^/]*//||' -e 's|^www\.||' -e 's|/.*||' -e 's|[[:space:]]||g')
            [ -n "$domain" ] || continue

            echo "Processing scan for target: $domain..."
            echo "----------------------------------------------------------" >> "$REPORT_FILE"
            echo "TARGET DOMAIN: $domain" >> "$REPORT_FILE"
            echo "Analysis Status: Active Scanning Completed" >> "$REPORT_FILE"
            echo "----------------------------------------------------------" >> "$REPORT_FILE"
            echo "Potential Backend / Misconfigured Origin IPs Discovered:" >> "$REPORT_FILE"
            echo "" >> "$REPORT_FILE"

            python3 cloudrip.py "$domain" -t 40 -o temp_out.txt -f normal

            if [ -f temp_out.txt ] && [ -s temp_out.txt ]; then
              # Filter out [NOT FOUND] domains from the report while keeping actual findings.
              grep -v '^\[NOT FOUND\]' temp_out.txt | awk '
                BEGIN { section = 0 }
                /^\[FOUND\]/ { section = 1; print; next }
                /^\[CLOUDFLARE\]/ { section = 1; print; next }
                /^\[NOT FOUND\]/ { section = 0; next }
                section { print }
              ' > temp_out_filtered.txt

              if [ -s temp_out_filtered.txt ]; then
                cat temp_out_filtered.txt >> "$REPORT_FILE"
              else
                echo "  [INFO] No actionable leaked backend origin IPs detected for this target." >> "$REPORT_FILE"
              fi

              rm -f temp_out_filtered.txt
            else
              echo "  [INFO] No leaked backend origin IPs detected for this target." >> "$REPORT_FILE"
            fi

            echo "" >> "$REPORT_FILE"
            echo "==========================================================" >> "$REPORT_FILE"
            rm -f temp_out.txt

          done < "$DOMAINS_FILE"
          
          echo "Report file size: $(wc -c < "$REPORT_FILE") bytes"

      - name: Upload Downloadable Security Report
        uses: actions/upload-artifact@v4
        with:
          name: Business-Security-Origin-Report
          path: origin_ip_report.txt
          if-no-files-found: error
