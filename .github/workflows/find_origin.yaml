name: Find Origin IP via CloudRip File Scan

on:
  workflow_dispatch: # Allows you to manually trigger the run via the web UI

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Clone CloudRip & Install Dependencies
      run: |
        git clone https://github.com cloudrip_engine
        cd cloudrip_engine
        pip install -r requirements.txt

    - name: Initialize Readable Security Report
      run: |
        echo "==========================================================" > origin_ip_report.txt
        echo "           CLOUD DISCOVERY INFRASTRUCTURE REPORT         " >> origin_ip_report.txt
        echo "           Generated: $(date -u)" >> origin_ip_report.txt
        echo "==========================================================" >> origin_ip_report.txt
        echo "" >> origin_ip_report.txt

    - name: Loop and Scan Domains From File
      run: |
        cd cloudrip_engine
        
        # Read the committed file line by line, skipping empty lines or comments
        while IFS= read -r domain || [ -n "$domain" ]; do
          [[ -z "$domain" || "$domain" =~ ^# ]] && continue
          
          echo "Processing scan for: $domain..."
          echo "----------------------------------------------------------" >> ../origin_ip_report.txt
          echo "TARGET DOMAIN: $domain" >> ../origin_ip_report.txt
          echo "Analysis Status: Active Scanning Completed" >> ../origin_ip_report.txt
          echo "----------------------------------------------------------" >> ../origin_ip_report.txt
          echo "Potential Backend / Misconfigured Origin IPs Discovered:" >> ../origin_ip_report.txt
          echo "" >> ../origin_ip_report.txt
          
          # Run CloudRip on the current domain
          python3 cloudrip.py "$domain" -t 40 -o temp_out.txt -f normal
          
          # Check if CloudRip found anything and clean up formatting for readability
          if [ -f temp_out.txt ] && [ -s temp_out.txt ]; then
            cat temp_out.txt >> ../origin_ip_report.txt
          else
            echo "  [INFO] No leaked backend origin IPs detected for this target." >> ../origin_ip_report.txt
          fi
          
          echo "" >> ../origin_ip_report.txt
          echo "==========================================================" >> ../origin_ip_report.txt
          rm -f temp_out.txt
          
        done < ../domains.txt

    - name: Upload Downloadable Security Report
      uses: actions/upload-artifact@v4
      with:
        name: Business-Security-Origin-Report
        path: origin_ip_report.txt

